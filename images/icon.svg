<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A47"/><stop offset="1" stop-color="#0F1626"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC15A"/><stop offset="1" stop-color="#F28C28"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <!-- stack of past cells, older ones fade -->
  <g font-family="DejaVu Sans Mono, monospace" font-weight="700">
    <rect x="76" y="92"  width="300" height="64" rx="16" fill="#2B3A5E" opacity="0.55"/>
    <rect x="76" y="176" width="300" height="64" rx="16" fill="#33476F" opacity="0.8"/>
    <rect x="76" y="260" width="300" height="64" rx="16" fill="#3D5585"/>
    <text x="102" y="134" font-size="30" fill="#7F92B8" opacity="0.6">&gt;</text>
    <rect x="132" y="117" width="150" height="14" rx="7" fill="#7F92B8" opacity="0.5"/>
    <text x="102" y="218" font-size="30" fill="#9FB1D4" opacity="0.8">&gt;</text>
    <rect x="132" y="201" width="190" height="14" rx="7" fill="#9FB1D4" opacity="0.7"/>
    <text x="102" y="302" font-size="30" fill="#E6ECF5">&gt;</text>
    <rect x="132" y="285" width="120" height="14" rx="7" fill="#E6ECF5"/>
  </g>
  <!-- magnifier with a history arrow in the lens -->
  <g transform="translate(330 330)">
    <line x1="58" y1="58" x2="112" y2="112" stroke="url(#amber)" stroke-width="34" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="86" fill="#0F1626" stroke="url(#amber)" stroke-width="22"/>
    <path d="M -42 -14 A 46 46 0 1 1 -30 34" fill="none" stroke="#FFC15A" stroke-width="13" stroke-linecap="round"/>
    <polygon points="-62,-30 -24,-26 -46,4" fill="#FFC15A"/>
    <line x1="0" y1="0" x2="0" y2="-26" stroke="#FFC15A" stroke-width="11" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="20" y2="12" stroke="#FFC15A" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
