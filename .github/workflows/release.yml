name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm test
      - run: npx --yes @vscode/vsce@3 package --no-dependencies
      - name: Publish a GitHub release when this version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "release v$v already exists"
          else
            notes=$(awk -v ver="## $v" '$0==ver{f=1;next} /^## /{f=0} f' CHANGELOG.md)
            gh release create "v$v" ./*.vsix --title "$v" --notes "$notes

          Install from the VS Code Marketplace, or download the .vsix and use Extensions → … → Install from VSIX…"
          fi
